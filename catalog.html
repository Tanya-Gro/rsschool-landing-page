<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Coffee</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('CH-Theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="src/css/globals.css">
  <link rel="stylesheet" href="src/css/styleguide.css">
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="stylesheet" href="src/css/catalog.css">
</head>

<body>
  <div class="d-home">
    <load src="src/layouts/header.html" />
    <main>
      <section class="menu" id="menu" aria-labelledby="menu-heading">
        <div class="container-2">
          <div class="offer">
            <h1 class="behind-each-of-our" id="menu-heading">
              <span class="span">Behind each of our cups hides an </span>
              <span class="text-wrapper-2">amazing surprise</span>
            </h1>
            <div class="tabs" role="tablist" aria-label="Menu categories">
              <button class="tab-item active" type="button" role="tab" aria-selected="true"
                aria-controls="coffee-menu-panel" id="coffee-tab" data-category="coffee">
                <span class="icon" aria-hidden="true">
                  <img class="text-wrapper-3" src="src/assets/icon1.png" alt="Coffee Icon">
                </span>
                <span class="coffee">Coffee</span>
              </button>
              <button class="tab-item" type="button" role="tab" aria-selected="false" aria-controls="tea-menu-panel"
                id="tea-tab" data-category="tea">
                <span class="icon" aria-hidden="true">
                  <img class="text-wrapper-3" src="src/assets/icon2.png" alt="Tea Icon">
                </span>
                <span class="coffee">Tea</span>
              </button>
              <button class="tab-item" type="button" role="tab" aria-selected="false" aria-controls="dessert-menu-panel"
                id="dessert-tab" data-category="dessert">
                <span class="icon" aria-hidden="true">
                  <img class="text-wrapper-3" src="src/assets/icon3.png" alt="Dessert Icon">
                </span>
                <span class="coffee">Dessert</span>
              </button>
            </div>
          </div>
          <div class="grid" id="coffee-menu-panel" role="tabpanel" aria-labelledby="coffee-tab" data-category="coffee">
          </div>
          <div class="grid" id="tea-menu-panel" role="tabpanel" aria-labelledby="tea-tab" data-category="tea" hidden>
          </div>
          <div class="grid" id="dessert-menu-panel" role="tabpanel" aria-labelledby="dessert-tab"
            data-category="dessert" hidden>
          </div>
        </div>
        <button class="button-arrow" type="button" id="add-cards" aria-label="Show addition cards" hidden>
          <img class="img-3" src="src/assets/refresh.svg" alt="Refresh cards">
        </button>
      </section>
    </main>
    <load src="src/layouts/footer.html" />
    <template id="card-template">
      <article class="preview">
        <img class="box" alt="">
        <div class="description">
          <div class="title">
            <h2 class="text-wrapper-4"></h2>
            <p class="espresso-coffee-with"></p>
          </div>
          <p class="text-wrapper-4"></p>
        </div>
      </article>
    </template>
  </div>
  <script type="module" src="/src/js/catalog.js"></script>
</body>

</html>
